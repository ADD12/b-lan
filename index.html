
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-LAN Community Core</title>
    <link rel="stylesheet" href="/index.css">
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .loader-logo {
        width: 64px;
        height: 64px;
        background: #4f46e5;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;
        font-weight: 900;
        font-size: 32px;
        margin-bottom: 24px;
        box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2);
      }
      .loader-text {
        color: #64748b;
        font-family: monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }
    </style>
</head>
<body>
    <div id="initial-loader">
      <div className="loader-logo">B</div>
      <div className="loader-text">Initializing Mesh Node...</div>
    </div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
